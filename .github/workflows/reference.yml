name: Verify public reference access

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/probe_references.py'
      - '.github/workflows/reference.yml'

permissions:
  contents: read

jobs:
  references:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install yt-dlp==2026.8.19
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Probe official and user-supplied references
        run: python tools/probe_references.py --report build/reference-access.json
      - name: Verify publicly accessible original source bytes
        run: python tools/acquire_original.py --work-dir build/reference-source --archive build/reference.bapple --report-dir build/reference-reports
      - uses: actions/upload-artifact@v4
        with:
          name: reference-access-evidence
          path: |
            build/reference-access.json
            build/reference-reports/*.json
          if-no-files-found: error
