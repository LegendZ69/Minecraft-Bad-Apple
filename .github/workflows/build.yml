name: Build and verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      PULSE_SINK: badapple
      PULSE_LATENCY_MSEC: '20'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg xvfb pulseaudio pulseaudio-utils libasound2-plugins libgl1-mesa-dri
      - name: Verify video conversion
        run: |
          mkdir -p build/cloud-verification/reports
          python -m unittest discover -s tests -v 2>&1 | tee build/cloud-verification/reports/python-tests.txt
      - name: Compile mod and test playback
        run: |
          gradle --no-daemon build 2>&1 | tee build/cloud-verification/reports/gradle-build.txt
          cp build/test-results/test/TEST-*.xml build/cloud-verification/reports/
      - name: Verify reproducible production JAR
        run: |
          cp build/libs/minecraft-bad-apple-1.1.0.jar build/first-build.jar
          gradle --no-daemon jar remapJar --rerun-tasks
          cmp build/first-build.jar build/libs/minecraft-bad-apple-1.1.0.jar
          sha256sum build/first-build.jar build/libs/minecraft-bad-apple-1.1.0.jar > build/cloud-verification/reports/reproducible-build.txt
      - name: Generate and verify diagnostic media
        run: |
          python tools/generate_fixture.py --output build/synthetic.mkv
          python tools/prepare_video.py build/synthetic.mkv --output build/smoke-game/badapple/smoke.bapple
          python tools/verify_archive.py build/smoke-game/badapple/smoke.bapple --source build/synthetic.mkv --report build/cloud-verification/reports/synthetic-source-comparison.json
          cp tools/cloud-smoke-options.txt build/smoke-game/options.txt
      - name: Exercise actual Minecraft renderer, controls, and audio sink
        env:
          ALSA_CONFIG_PATH: ${{ github.workspace }}/tools/cloud-smoke-asound.conf
        run: |
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=badapple rate=48000 channels=2 format=s16le
          parec --device=badapple.monitor --format=s16le --rate=48000 --channels=2 --file-format=wav build/captured-audio.wav &
          capture_pid=$!
          trap 'kill -INT "$capture_pid" 2>/dev/null || true' EXIT
          timeout 480s xvfb-run -a -s '-screen 0 1280x720x24' gradle --no-daemon runSmokeClient 2>&1 | tee build/cloud-verification/reports/minecraft-client.txt
          kill -INT "$capture_pid"
          wait "$capture_pid" || true
          trap - EXIT
          python tools/verify_cloud_smoke.py build/cloud-verification/smoke-report.json --audio-capture build/captured-audio.wav --require-audio
      - name: Prepare exact-JAR production test launcher
        run: |
          gradle --no-daemon remapSmokeJar
          mkdir -p build/production-toolchain build/production-game/badapple build/production-verification
          curl --fail --location --retry 2 --output build/production-toolchain/gradle-8.12-bin.zip https://services.gradle.org/distributions/gradle-8.12-bin.zip
          # Published by https://gradle.org/release-checksums/ (Gradle 8.12 binary ZIP).
          echo '7a00d51fb93147819aab76024feece20b6b84e420694101f276be952e08bef03  build/production-toolchain/gradle-8.12-bin.zip' | sha256sum --check
          unzip -q build/production-toolchain/gradle-8.12-bin.zip -d build/production-toolchain
          cp build/smoke-game/badapple/smoke.bapple build/production-game/badapple/smoke.bapple
          cp tools/cloud-smoke-options.txt build/production-game/options.txt
      - name: Verify exact release JAR in Fabric production runtime
        env:
          ALSA_CONFIG_PATH: ${{ github.workspace }}/tools/cloud-smoke-asound.conf
        run: |
          parec --device=badapple.monitor --format=s16le --rate=48000 --channels=2 --file-format=wav build/production-captured-audio.wav &
          capture_pid=$!
          trap 'kill -INT "$capture_pid" 2>/dev/null || true' EXIT
          timeout 600s build/production-toolchain/gradle-8.12/bin/gradle --no-daemon -p tools/production-smoke prodSmokeClient 2>&1 | tee build/cloud-verification/reports/production-minecraft-client.txt
          kill -INT "$capture_pid"
          wait "$capture_pid" || true
          trap - EXIT
          python tools/verify_cloud_smoke.py build/production-verification/smoke-report.json --audio-capture build/production-captured-audio.wav --require-audio
          mkdir -p build/cloud-verification/production
          cp build/production-verification/*.json build/production-verification/*.png build/cloud-verification/production/
      - name: Exhaustive full-length synthetic stress test
        run: |
          python tools/generate_fixture.py --duration 219 --output build/stress.mkv
          python tools/prepare_video.py build/stress.mkv --output build/stress.bapple
          python tools/verify_archive.py build/stress.bapple --source build/stress.mkv --report build/cloud-verification/reports/stress-source-comparison.json
      - name: Retrieve and exhaustively compare the original creator reference
        run: |
          python -m pip install yt-dlp==2026.8.19
          python tools/acquire_original.py --work-dir build/reference-source --archive build/smoke-game/badapple/reference.bapple --report-dir build/cloud-verification/reports
          python -c 'import json; assert json.load(open("build/cloud-verification/reports/reference-acquisition.json"))["status"] == "downloaded_converted_verified", "Original media unavailable: release verification cannot be completed; see access report. No bypass attempted."'
      - name: Verify complete original reference with the exact production JAR
        env:
          ALSA_CONFIG_PATH: ${{ github.workspace }}/tools/cloud-smoke-asound.conf
        run: |
          test -f build/smoke-game/badapple/reference.bapple
          mkdir -p build/production-reference-game/badapple
          cp build/smoke-game/badapple/reference.bapple build/production-reference-game/badapple/reference.bapple
          cp tools/cloud-smoke-options.txt build/production-reference-game/options.txt
          parec --device=badapple.monitor --format=s16le --rate=48000 --channels=2 --file-format=wav build/reference-captured-audio.wav &
          capture_pid=$!
          trap 'kill -INT "$capture_pid" 2>/dev/null || true' EXIT
          timeout 600s build/production-toolchain/gradle-8.12/bin/gradle --no-daemon -p tools/production-smoke prodReferenceClient 2>&1 | tee build/cloud-verification/reports/original-minecraft-client.txt
          kill -INT "$capture_pid"
          wait "$capture_pid" || true
          trap - EXIT
          python tools/verify_cloud_smoke.py build/reference-verification/smoke-report.json --reference --require-audio --audio-capture build/reference-captured-audio.wav
          cp build/reference-verification/smoke-report.json build/cloud-verification/reports/original-minecraft-report.json
          mkdir -p build/cloud-verification/reference
          cp build/reference-verification/*.json build/reference-verification/*.png build/cloud-verification/reference/
      - name: Package versioned release and verify checksums
        run: |
          python tools/package_release.py --version 1.1.0 --commit "$GITHUB_SHA" --jar build/libs/minecraft-bad-apple-1.1.0.jar --output dist/v1.1.0 --evidence-dir build/cloud-verification --require-original --require-production
          python tools/package_release.py --verify-directory dist/v1.1.0
      - uses: actions/upload-artifact@v4
        with:
          name: minecraft-bad-apple-v1.1.0
          path: dist/v1.1.0/*
          if-no-files-found: error
      - name: Preserve cloud verification evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-verification-evidence
          path: |
            build/cloud-verification/**/*.json
            build/cloud-verification/**/*.txt
            build/cloud-verification/**/*.xml
            build/cloud-verification/*.png
            build/reference-verification/*.json
            build/reference-verification/*.png
            build/smoke-game/logs/latest.log
            build/production-verification/*.json
            build/production-verification/*.png
            build/production-game/logs/latest.log
            build/production-reference-game/logs/latest.log
          if-no-files-found: warn
      - name: Preserve synthetic-only sink recording for audio diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-audio-diagnostics
          path: |
            build/captured-audio.wav
            build/production-captured-audio.wav
          if-no-files-found: warn
