plugins {
    id 'fabric-loom' version '1.7.4'
}

version = '1.1.0'
group = 'dev.legend.badapple'
base { archivesName = 'minecraft-bad-apple' }

repositories { mavenCentral() }

dependencies {
    minecraft 'com.mojang:minecraft:1.21.1'
    mappings 'net.fabricmc:yarn:1.21.1+build.3:v2'
    modImplementation 'net.fabricmc:fabric-loader:0.16.5'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.102.1+1.21.1'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}
tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand(version: project.version) }
}
test { useJUnitPlatform() }

sourceSets {
    smoke {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

loom {
    mods {
        badapple { sourceSet sourceSets.main }
        badapple_smoke { sourceSet sourceSets.smoke }
    }
    runs {
        smokeClient {
            client()
            name 'Bad Apple Cloud Smoke'
            source sourceSets.smoke
            runDir 'build/smoke-game'
            vmArg '-Dbadapple.smoke=true'
            def referenceMode = project.findProperty('smokeReference') == 'true'
            vmArg "-Dbadapple.smoke.reference=${referenceMode}"
            vmArg "-Dbadapple.smoke.output=${layout.buildDirectory.dir(referenceMode ? 'reference-verification' : 'cloud-verification').get().asFile.absolutePath}"
            programArgs '--width', '1280', '--height', '720'
            vmArg '-Xmx3G'
        }
    }
}

check.dependsOn tasks.named('compileSmokeJava')
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
